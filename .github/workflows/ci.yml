name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swiftc --version
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NetSpeed.app
          path: build/NetSpeed.app

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: cd build && ditto -c -k --keepParent NetSpeed.app NetSpeed.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: NetSpeed.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
